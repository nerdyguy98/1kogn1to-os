name: Build 1K0GN1T0 OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Debian Live build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso \
            isolinux syslinux-common dosfstools mtools debian-archive-keyring

      - name: Configure Debian (not Ubuntu) Trixie
        shell: bash
        run: |
          set -euxo pipefail
          # Ubuntu's live-build package can inherit Ubuntu mode defaults.
          # Remove saved config and force Debian mode explicitly.
          rm -rf config/binary config/bootstrap config/chroot config/common config/source
          sudo rm -rf chroot .build .build-* || true
          lb config \
            --ignore-system-defaults \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --debian-installer live \
            --mirror-bootstrap https://deb.debian.org/debian \
            --mirror-chroot https://deb.debian.org/debian \
            --mirror-binary https://deb.debian.org/debian \
            --mirror-chroot-security https://security.debian.org/debian-security
            --mirror-binary-security https://security.debian.org/debian-security
            --keyring-packages debian-archive-keyring \
            --bootappend-live "boot=live components username=1kogn1to hostname=1kogn1to"
          echo '--- Verify generated live-build mirror configuration ---'
          grep -RniE 'archive\.ubuntu\.com|ports\.ubuntu\.com|security\.ubuntu\.com' config && { echo 'ERROR: Ubuntu mirror found in live-build config'; exit 1; } || true
          grep -RniE 'deb\.debian\.org|security\.debian\.org' config || true
          echo '--- Bootstrap config ---'
          cat config/bootstrap

      - name: Build live ISO
        shell: bash
        run: |
          set -euxo pipefail
          sudo lb build
          mkdir -p build-output
          sudo find . -maxdepth 1 -type f -name '*.iso' -exec cp {} build-output/1K0GN1T0-OS-amd64.iso \\;
          test -s build-output/1K0GN1T0-OS-amd64.iso
          sha256sum build-output/1K0GN1T0-OS-amd64.iso > build-output/1K0GN1T0-OS-amd64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1K0GN1T0-OS-amd64-ISO
          path: build-output/
          if-no-files-found: error
          retention-days: 14
